<g id="NAV-UC19"><ellipse cx="629" cy="952" rx="198" ry="16" fill="#fff" stroke="#688093" stroke-width="1.3"/><text x="629" y="957" text-anchor="middle" font-size="16"><tspan class="minor">NAV-UC19</tspan><tspan dx="12">发布通过验证的经验版本</tspan></text></g>
<g id="NAV-UC20"><ellipse cx="629" cy="992" rx="198" ry="16" fill="#fff" stroke="#688093" stroke-width="1.3"/><text x="629" y="997" text-anchor="middle" font-size="16"><tspan class="minor">NAV-UC20</tspan><tspan dx="12">停用或回退失效经验</tspan></text></g>
