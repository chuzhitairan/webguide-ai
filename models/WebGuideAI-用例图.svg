<g id="NAV-UC09"><ellipse cx="629" cy="463" rx="198" ry="16" fill="#fff" stroke="#688093" stroke-width="1.3"/><text x="629" y="468" text-anchor="middle" font-size="16"><tspan class="minor">NAV-UC09</tspan><tspan dx="12">确认网页外结果</tspan></text></g>
<g id="NAV-UC10"><ellipse cx="629" cy="502" rx="198" ry="16" fill="#fff" stroke="#688093" stroke-width="1.3"/><text x="629" y="507" text-anchor="middle" font-size="16"><tspan class="minor">NAV-UC10</tspan><tspan dx="12">了解无法继续的原因</tspan></text></g>
