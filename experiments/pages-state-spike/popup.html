<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGuide AI · Pages 实验</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <p class="eyebrow">WEBGUIDE AI · 可行性实验</p><h1>发布一个 Pages 页面</h1>
  <p id="mode">手动检查 · 只读 · 观察保留 15 分钟</p>
  <p id="target" class="target"></p>
  <div class="actions"><button id="inspect" type="button">检查当前标签页</button><button id="reset" type="button" class="secondary">清空观察</button></div>
  <p id="notice" role="status">尚未读取页面。</p>
  <section aria-label="检查进度" id="steps"></section>
  <section class="next"><h2 id="outcome">等待检查</h2><p id="next"></p></section>
  <details><summary>本次观察证据</summary><pre id="evidence">[]</pre></details>
  <p class="footnote">仅用于指定练习仓库。不会点击、保存或提交网页内容。换页面后请再次手动检查。</p>
</main><script type="module" src="popup.mjs"></script></body></html>
